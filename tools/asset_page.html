<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Montserrat;font-weight:900;src:url(../fonts/montserrat-latin-900-normal.woff2)}
html,body{margin:0;background:transparent}
</style></head><body><div id="holder" style="display:inline-block;line-height:0"></div>
<script src="../character/character.js"></script>
<script>
// appelé par make_video.py : dessine une variante du personnage à sa taille naturelle et renvoie [largeur, hauteur]
window.draw = (o) => {
  const h = document.getElementById('holder'); h.innerHTML = CHARACTER.render(o);
  const s = h.querySelector('svg'); const vb = s.viewBox.baseVal;
  s.setAttribute('width', vb.width); s.setAttribute('height', vb.height); return [vb.width, vb.height];
};
</script></body></html>
